name: ZOMBIE Canary Audit (offline)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q -m "not remote"
